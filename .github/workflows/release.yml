# Release pipeline.
#   Pull request:  unit tests -> quality checks with the real model and a judge model
#   Push to main:  the same, then scripts/release.sh (agent: 0% -> smoke test -> 10% -> 100%)
# A failed step stops everything after it, so a change that fails the quality checks never ships.
#
# Logs in to Google Cloud with Workload Identity Federation: no key is stored in GitHub.
# Settings are repository variables (none are secret). `GITHUB_REPO=owner/name make deploy` prints them.
# Actions are pinned to exact commits, so a changed tag upstream cannot change what runs here.
name: release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets a job prove to Google which repository and branch it runs for

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never stop a deploy half way

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: proto/requirements-dev.txt
      - run: make test PYTHON=python

  quality-checks:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      GOOGLE_GENAI_USE_ENTERPRISE: "TRUE"
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
      GOOGLE_CLOUD_LOCATION: global
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'gemini-3.1-pro-preview' }}
    steps:
      - name: Check the pipeline is connected to Google Cloud
        if: vars.GCP_WIF_PROVIDER == ''
        run: |
          echo "::error::GCP_WIF_PROVIDER is not set, so the quality checks cannot reach Gemini. Run GITHUB_REPO=${{ github.repository }} make deploy and set the variables it prints."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: proto/requirements-dev.txt
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVALS_SA }} # may only call Gemini
      - run: make evals PYTHON=python

  deploy:
    needs: quality-checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }} # only jobs on main may use it
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Token for calling the new agent revision
        id: token
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ircc-agent
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - run: scripts/release.sh
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          BUILD_SA: ${{ vars.GCP_BUILD_SA }}
          ID_TOKEN: ${{ steps.token.outputs.id_token }}
          CANARY_MINUTES: ${{ vars.CANARY_MINUTES || '5' }}
